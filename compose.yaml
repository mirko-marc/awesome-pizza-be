include:
  - ../awesome-pizza-liquibase/compose.yaml

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: awesome-pizza-backend:latest
    depends_on:
      postgres:
        condition: service_healthy
      liquibase:
        condition: service_completed_successfully
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-awesome_pizza}
      DB_USERNAME: ${POSTGRES_USER:-pizza}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-pizza}
      DATABASE_SCHEMA: ${DATABASE_SCHEMA:-awesome_pizza}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-pizzaiolo}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-PasswordSicura123!}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:-MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=}
      JWT_ISSUER: ${JWT_ISSUER:-awesome-pizza}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-PT1H}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      LOG_FILE: /app/logs/awesome-pizza.log
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - backend_logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/api/v1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ../awesome-pizza-fe
      dockerfile: Dockerfile
    image: awesome-pizza-frontend:latest
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    volumes:
      - ./docker/frontend-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  backend_logs:
